# Production override: real spaceship prod API instead of the dev API.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# NOTE: registry credentials come from env_file ./.env — for prod, that file
# must contain the prod SPACESHIP_USERNAME/SPACESHIP_TOKEN (the values at the
# bottom of the current .env). Non-secret prod settings are overridden here.
services:
  hog:
    command: bun run src/index.ts
    environment:
      COOKIE_SECURE: "true"
      APP_ENV: production
    restart: unless-stopped

  heron:
    command: bun run src/index.ts
    environment:
      SPACESHIP_BASE: https://spaceship.dev/api
    restart: unless-stopped

  weasel:
    command: bun run src/index.ts
    restart: unless-stopped

  wombat:
    command: bun run src/index.ts
    restart: unless-stopped

  badger:
    command: bun run src/index.ts
    restart: unless-stopped

  otter:
    command: bun run src/index.ts
    restart: unless-stopped

  beaver:
    command: bun run src/index.ts
    restart: unless-stopped

  pigeon:
    command: bun run src/index.ts
    restart: unless-stopped

  dove:
    command: bun run src/index.ts
    restart: unless-stopped

  stalwart:
    restart: unless-stopped

  # Web container (dev runs the client on the host instead).
  client:
    build:
      context: ./client
      args:
        HOG_URL: http://hog:8787
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    environment:
      HOG_URL: http://hog:8787
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""
    restart: unless-stopped

  # TLS terminator in front of the client. Hostname comes from .env
  # (D2_PUBLIC_HOST) — an <ip>.sslip.io stopgap until d2domains.com lands.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      D2_PUBLIC_HOST: ${D2_PUBLIC_HOST:?set D2_PUBLIC_HOST in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
