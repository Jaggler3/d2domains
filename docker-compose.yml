services:
  hog:
    build:
      context: ./system/hog
    command: bun run --watch src/index.ts
    env_file: ./.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/d2gres
      REDIS_URL: redis://redis:6379
      REGISTRY_URL: http://heron:8783
      WEASEL_URL: http://weasel:8781
      WOMBAT_URL: http://wombat:8782
      PORT: 8787
      CLIENT_ORIGIN: http://localhost:3000
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      heron:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: ./system/hog
          target: /app
          ignore:
            - node_modules
            - .env*
            - data
        - action: rebuild
          path: ./system/hog/package.json

  heron:
    build:
      context: ./system/heron
    command: bun run --watch src/index.ts
    env_file: ./.env
    environment:
      HERON_PORT: 8783
      REDIS_URL: redis://redis:6379
    ports:
      - "8783:8783"
    depends_on:
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./system/heron
          target: /app
          ignore:
            - node_modules
            - .env*
            - data
        - action: rebuild
          path: ./system/heron/package.json

  weasel:
    build:
      context: ./system/weasel
    command: bun run --watch src/index.ts
    env_file: ./.env
    environment:
      WEASEL_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/d2weasel
      WEASEL_PORT: 8781
    ports:
      - "8781:8781"
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./system/weasel
          target: /app
          ignore:
            - node_modules
            - .env*
            - data
        - action: rebuild
          path: ./system/weasel/package.json

  wombat:
    build:
      context: ./system/wombat
    command: bun run --watch src/index.ts
    env_file: ./.env
    environment:
      WOMBAT_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/d2wombat
      WOMBAT_PORT: 8782
    ports:
      - "8782:8782"
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./system/wombat
          target: /app
          ignore:
            - node_modules
            - .env*
            - data
        - action: rebuild
          path: ./system/wombat/package.json

  badger:
    build:
      context: ./system/badger
    command: bun run --watch src/index.ts
    env_file: ./.env
    environment:
      REDIS_URL: redis://redis:6379
      REGISTRY_URL: http://heron:8783
      WEASEL_URL: http://weasel:8781
      WOMBAT_URL: http://wombat:8782
    depends_on:
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./system/badger
          target: /app
          ignore:
            - node_modules
            - .env*
            - data
        - action: rebuild
          path: ./system/badger/package.json

  beaver:
    build:
      context: ./system/beaver
    command: bun run --watch src/index.ts
    env_file: ./.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./system/beaver
          target: /app
          ignore:
            - node_modules
            - .env*
            - data
        - action: rebuild
          path: ./system/beaver/package.json

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: d2gres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
